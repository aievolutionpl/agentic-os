name: Verify and package
on:
  push:
    branches: [main, feat/agenting-os-0-4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run release:audit
      - name: Native Windows Electron verification
        if: runner.os == 'Windows'
        run: |
          foreach ($suite in @("smoke", "qa:tools", "qa:workspace", "qa:harness", "qa:workbench")) {
            $env:AGENTING_QA_OUTPUT = ".runtime/ci-qa/" + $suite.Replace(":", "-")
            npm run $suite
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Linux Electron verification under Xvfb
        if: runner.os == 'Linux'
        env:
          AGENTING_TEST_NO_SANDBOX: '1'
        run: |
          for suite in smoke qa:tools qa:workspace qa:harness qa:workbench; do
            AGENTING_QA_OUTPUT=".runtime/ci-qa/${suite/:/-}" xvfb-run -a npm run "$suite" || exit "$?"
          done
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-${{ matrix.os }}
          path: .runtime/ci-qa
          include-hidden-files: true
          retention-days: 14
  windows-package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run notices
      - run: npm run package:win
      - run: npm run smoke:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Agenting-OS-windows-x64-unsigned
          path: release/*-setup.exe
          if-no-files-found: error
          retention-days: 14
