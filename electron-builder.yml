appId: pl.aievolution.agentingos
productName: Agenting OS
copyright: Copyright © 2026 AI Evolution Polska
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
directories:
  output: release
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - package.json
  - LICENSE
  - NOTICE
  - licenses/**/*
  - resources/skills/**/*
  - src/renderer/fonts/*OFL.txt
  - docs/research/harness-assets-2026-10-19.md
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: Agenting-OS-${version}-windows-x64-setup.${ext}
  shortcutName: Agenting OS
