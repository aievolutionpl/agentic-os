name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a synthetic repository. Do not share secrets or private project data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Agenting OS version and provider version
